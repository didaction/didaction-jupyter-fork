name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # The browser application is validated by wasm-pack in the TypeScript job.
      # Keep this target check on platform-neutral crates: checking the entire
      # workspace selects eframe's native winit configuration for wasm32.
      - run: cargo check --target wasm32-unknown-unknown -p notebook-protocol -p notebook-core -p notebook-runtime

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true
      - run: uv sync --python 3.12 --frozen
      - run: uv run ruff format --check services scripts tests deploy
      - run: uv run ruff check services scripts tests deploy
      - run: uv run mypy
      - run: uv run pytest -q

  licenses:
    name: Distribution licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --python 3.12 --frozen
      - run: pnpm audit:licenses

  browser-local:
    name: Browser-local acceptance
    needs: [rust, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm prepare:browser-kernel
      - run: pnpm build:wasm
      - run: pnpm test:browser-kernel
      - run: pnpm build:browser
      - run: pnpm test:browser-static

  real-kernel:
    name: Real IPython kernel
    needs: [rust, typescript, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --python 3.12 --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: DIDACTION_GATEWAY_IMPLEMENTATION=rust scripts/smoke.sh
