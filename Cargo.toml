[workspace]
resolver = "2"
members = [
  "crates/notebook-protocol",
  "crates/notebook-core",
  "crates/notebook-egui",
  "crates/notebook-wasm",
  "crates/notebook-runtime",
  "crates/notebook-gateway",
  "crates/didaction-jupyter-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/didaction/didaction-jupyter"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = "=0.28.1"
dirs = "=6.0.0"
eframe = { version = "0.32.3", default-features = false, features = ["glow"] }
egui = "0.32.3"
egui_code_editor = "=0.2.17"
egui_commonmark = { version = "=0.21.0", default-features = false }
egui_extras = { version = "0.32.3", features = ["syntect", "image", "svg"] }
mitex = "=0.2.4"
pulldown-cmark = "=0.13.4"
js-sys = "0.3.82"
notebook-core = { path = "crates/notebook-core" }
notebook-egui = { path = "crates/notebook-egui" }
notebook-protocol = { path = "crates/notebook-protocol" }
notebook-runtime = { path = "crates/notebook-runtime" }
ratatui = "=0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "=0.9.12"
thiserror = "2.0.17"
typst = "=0.14.2"
typst-as-lib = { version = "=0.15.4", default-features = false }
typst-kit = { version = "=0.14.2", default-features = false, features = ["fonts", "embed-fonts"] }
typst-render = "=0.14.2"
uuid = { version = "1.18.1", features = ["js", "serde", "v4"] }
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
web-sys = { version = "0.3.82", features = ["CssStyleDeclaration", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Node", "Window"] }

[profile.release]
lto = "thin"
opt-level = "s"
codegen-units = 1
